---
name: Make
'on':
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci

permissions:
  contents: read

jobs:
  make:
    name: Make
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies.
        run: sudo apt-get install -y sassc gettext

      - name: Make
        run: make

      - name: Install modules
        run: sudo npm install eslint@9.39.5 -g

      - name: Make Check
        run: make check

      - name: Make Install
        run: make install

      - name: Generate translations
        run: make potfile

      - name: Build release archive
        run: make zip-file VERSION=109

      - name: Verify release archive
        run: unzip -t dash-to-dock@micxgx.gmail.com_v109.zip

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goshos-dock-v109
          path: dash-to-dock@micxgx.gmail.com_v109.zip
          if-no-files-found: error
