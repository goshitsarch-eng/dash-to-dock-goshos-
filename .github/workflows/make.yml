---
name: Make
'on':
  pull_request:
  push:
    branches:
      - master
      - ubuntu-dock
      - make_ci

permissions:
  contents: read

jobs:
  make:
    name: Make
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies.
        run: sudo apt-get install -y sassc gettext

      - name: Make
        run: make

      - name: Install modules
        run: sudo npm install eslint@9.39.5 -g

      - name: Make Check
        run: make check

      - name: Make Install
        run: make install

      - name: Generate translations
        run: make potfile

      - name: Build and verify release archive
        id: package
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("metadata.json", encoding="utf-8"))["version"])')
          [[ "$version" =~ ^[0-9]+$ ]]
          archive="dash-to-dock@micxgx.gmail.com_v${version}.zip"
          make zip-file VERSION="$version"
          unzip -t "$archive"
          printf 'version=%s\narchive=%s\n' "$version" "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goshos-dock-v${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
